name: github-ci-msw

on: [push]

jobs:
  build:
    runs-on: windows-latest

    strategy:
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Install boost
        uses: MarkusJx/install-boost@v2.5.1
        id: install-boost
        with:
          # REQUIRED: Specify the required boost version
          # A list of supported versions can be found here:
          # https://github.com/actions/boost-versions/blob/main/versions-manifest.json
          boost_version: 1.89.0
          platform_version: 2022
          boost_install_dir: C:\libraries\
          toolset: msvc

      - name: Add msbuild
        uses: microsoft/setup-msbuild@v2

      - name: Add wex libs
        uses: dawidd6/action-download-artifact@v13
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: develop
          workflow: ci-msw.yml
          repo: antonvw/wex

      - name: Set version variable
        run: echo "VERSION=$(src/filter-version.ps1)" >> "$env:GITHUB_ENV"

      - name: Configure
        shell: pwsh
        run: |
          mkdir -Force build
          mkdir -Force "c:\Program Files (x86)\wex\include\wex\$env:VERSION"
          mkdir -Force "c:\Program Files (x86)\wex\lib"
          Get-ChildItem -Path ".\*.lib" -Recurse | Move-Item -Force -Destination "c:\Program Files (x86)\wex\lib"
          git clone --recursive --shallow-submodules --depth 1 https://github.com/antonvw/wex.git
          Copy-Item -Path wex\cmake -Destination cmake -Recurse
          Copy-Item -Path wex\include\wex -Destination "c:\Program Files (x86)\wex\include\wex\$env:VERSION\wex" -Recurse
          Copy-Item -Path wex\external\wxWidgets\include\wx -Destination "c:\Program Files (x86)\wex\include\wex\$env:VERSION\wx" -Recurse
          Copy-Item -Path wex-lib-windows\build/external\wxWidgets\lib\vc_x64_lib\mswu\wx\setup.h -Destination "c:\Program Files (x86)\wex\include\wex\$env:VERSION\wx" -Recurse
          Copy-Item -Path wex\external\pugixml\src\pugiconfig.hpp -Destination "c:\Program Files (x86)\wex\include\wex\$env:VERSION" -Recurse
          Copy-Item -Path wex\external\pugixml\src\pugixml.hpp -Destination "c:\Program Files (x86)\wex\include\wex\$env:VERSION" -Recurse
          Copy-Item -Path wex\external\ctags\libreadtags\readtags.h -Destination "c:\Program Files (x86)\wex\include\wex\$env:VERSION" -Recurse
          Copy-Item wex\external\wxMaterialDesignArtProvider\MaterialDesign\* -Destination "c:\Program Files (x86)\wex\include\wex\$env:VERSION\" -Recurse
          Copy-Item -Path wex\external\wxWidgets\3rdparty\catch\single_include\catch2\catch.hpp -Destination "c:\Program Files (x86)\wex\include\wex\$env:VERSION" -Recurse
          Copy-Item wex\external\trompeloeil\include\* -Destination "c:\Program Files (x86)\wex\include\wex\$env:VERSION\" -Recurse
          .\wex\build-gen.ps1 -boost_dir ${{steps.install-boost.outputs.BOOST_ROOT}} -prepare

      - name: Build
        working-directory: build
        run: |
          msbuild /noLogo /m /p:Configuration=Release ALL_BUILD.vcxproj

      - name: Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: syncped-windows
          path: |
            wex-lib-windows/data/*.*
            build/**/*.exe
