name: github-ci-msw

on: [push]

jobs:
  build:
    runs-on: windows-latest

    strategy:
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install boost
        uses: MarkusJx/install-boost@v2.4.5
        id: install-boost
        with:
          # REQUIRED: Specify the required boost version
          # A list of supported versions can be found here:
          # https://github.com/actions/boost-versions/blob/main/versions-manifest.json
          boost_version: 1.88.0
          boost_install_dir: C:\libraries\

      - name: Add msbuild
        uses: microsoft/setup-msbuild@v2

      - name: Add wex libs
        uses: dawidd6/action-download-artifact@v8
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: develop
          workflow: ci-msw.yml
          repo: antonvw/wex

      - name: Configure
        shell: pwsh
        run: |
          mkdir -Force build
          mkdir -Force "c:\Program Files (x86)\wex\include\wex\25.10"
          mkdir -Force "c:\Program Files (x86)\wex\lib"
          Get-ChildItem -Path ".\*.lib" -Recurse | Move-Item -Force -Destination "c:\Program Files (x86)\wex\lib"
          git clone --recursive --shallow-submodules --depth 1 https://github.com/antonvw/wex.git
          Copy-Item -Path wex\cmake -Destination cmake -Recurse
          Copy-Item -Path wex\include\wex -Destination "c:\Program Files (x86)\wex\include\wex\25.10\wex" -Recurse
          Copy-Item -Path wex\external\wxWidgets\include\wx -Destination "c:\Program Files (x86)\wex\include\wex\25.10\wx" -Recurse
          Copy-Item -Path wex-lib-windows\build/external\wxWidgets\lib\vc_x64_lib\mswu\wx\setup.h -Destination "c:\Program Files (x86)\wex\include\wex\25.10\wx" -Recurse
          Copy-Item -Path wex\external\pugixml\src\pugiconfig.hpp -Destination "c:\Program Files (x86)\wex\include\wex\25.10" -Recurse
          Copy-Item -Path wex\external\pugixml\src\pugixml.hpp -Destination "c:\Program Files (x86)\wex\include\wex\25.10" -Recurse
          Copy-Item -Path wex\external\ctags\libreadtags\readtags.h -Destination "c:\Program Files (x86)\wex\include\wex\25.10" -Recurse
          Copy-Item wex\external\wxMaterialDesignArtProvider\MaterialDesign\* -Destination "c:\Program Files (x86)\wex\include\wex\25.10\" -Recurse
          Copy-Item -Path wex\external\wxWidgets\3rdparty\catch\single_include\catch2\catch.hpp -Destination "c:\Program Files (x86)\wex\include\wex\25.10" -Recurse
          Copy-Item wex\external\trompeloeil\include\* -Destination "c:\Program Files (x86)\wex\include\wex\25.10\" -Recurse
          .\wex\build-gen.ps1 -boost_dir ${{steps.install-boost.outputs.BOOST_ROOT}} -prepare

      - name: Build
        working-directory: build
        run: |
          msbuild /noLogo /m /p:Configuration=Release ALL_BUILD.vcxproj

      - name: Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: syncped-windows
          path: |
            wex-lib-windows/data/*.*
            build/**/*.exe
